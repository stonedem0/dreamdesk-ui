name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read the code, nothing more
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck core
        working-directory: packages/core
        run: pnpm typecheck

      - name: Test core
        working-directory: packages/core
        run: pnpm test

      - name: Build core
        working-directory: packages/core
        run: pnpm build

      - name: Test react
        working-directory: packages/react
        run: pnpm test

      - name: Build react
        working-directory: packages/react
        run: pnpm build

      - name: Typecheck os
        working-directory: packages/os
        run: pnpm typecheck

      - name: Test os
        working-directory: packages/os
        run: pnpm test
