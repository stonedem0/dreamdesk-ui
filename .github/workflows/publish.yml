name: Release to npm

on:
  workflow_run:
    workflows: ["Cut Release (create tag and GitHub Release)"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      distTag:
        description: "Optional npm dist-tag (default: auto — latest for >=1.x, next for 0.x)"
        required: false
        default: ""

jobs:
  publish:
    name: Publish packages
    # Only after a successful release cut on master (which only maintainers can
    # start), or started by hand
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: GitHub vouches for this workflow, so no npm
      # token is stored (or expires). Set up on npmjs.com for each package.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # master (the release cut only counts on master), never a branch name
          # taken from the triggering run; the release tag is checked out below
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Resolve version and dist-tag
        id: ver
        # Inputs come in through env vars, never pasted into the script
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT: ${{ github.event.inputs.distTag }}
        run: |
          git fetch --tags --force
          TAG=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TAG=$(git tag --points-at "$RELEASE_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          fi
          if [ -z "$TAG" ]; then TAG=$(git describe --tags --exact-match 2>/dev/null || true); fi
          if [ -z "$TAG" ]; then TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1); fi
          VER="${TAG#v}"
          if [ -n "$INPUT" ]; then DIST="$INPUT"
          elif [[ "$VER" == 0.* ]]; then DIST="next"
          else DIST="latest"; fi
          # Build exactly what was tagged
          git checkout --quiet "refs/tags/$TAG"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "dist_tag=$DIST" >> $GITHUB_OUTPUT
          echo "Resolved: $TAG → npm tag=$DIST"

      - name: Sync package versions
        env:
          VER: ${{ steps.ver.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          node -e "
            const fs = require('fs'), ver = process.env.VER;
            ['package.json', 'packages/core/package.json', 'packages/react/package.json'].forEach(p => {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = ver;
              // npm provenance requires repository.url to match the repo the
              // workflow ran in; older tags don't have it, so set it here
              pkg.repository = { type: 'git', url: 'git+' + process.env.REPO_URL + '.git' };
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
              console.log(pkg.name, '->', ver);
            });
          "

      - name: Remove unpublished workspace deps before install
        run: |
          node -e "
            const fs = require('fs');
            const p = 'packages/react/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            // @dreamdesk/core is aliased to local source in vite config — not needed installed
            delete pkg.dependencies['@dreamdesk/core'];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build packages
        run: pnpm run build

      - name: Assemble root package for publish
        run: |
          # JS + types + style from react build
          cp -r packages/react/dist dist
          # Theme CSS files from core
          mkdir -p css
          cp packages/core/css/*.css css/

      - name: Preview tarball
        run: npm pack --dry-run

      # Authenticated by trusted publishing (no token), with provenance
      - name: Publish @dreamdesk/ui
        run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.ver.outputs.dist_tag }}

      # @dreamdesk/os has versions of its own: it's published when its version
      # isn't on npm yet, and skipped otherwise. Also trusted publishing.
      - name: Publish @dreamdesk/os (when its version is new)
        working-directory: packages/os
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@dreamdesk/os@$VERSION" version > /dev/null 2>&1; then
            echo "@dreamdesk/os@$VERSION is already on npm: skipped"
          else
            pnpm build
            npm publish --access public
          fi
